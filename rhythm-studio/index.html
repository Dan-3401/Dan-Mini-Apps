<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>律动透明视频工坊</title>
    <link rel="stylesheet" href="./styles.css" />
    <link rel="stylesheet" href="./controls.css" />
  </head>
  <body>
    <main class="app-shell">
      <header class="topbar">
        <div>
          <p class="eyebrow">AUDIO REACTIVE CREATOR</p>
          <h1>律动透明视频工坊</h1>
          <p class="subtitle">拖入音频或视频，生成可叠加到剪辑项目中的透明律动素材。</p>
        </div>
        <div class="top-actions">
          <label class="language-picker">语言 / 日本語 / EN
            <select id="languageSelect">
              <option value="zh">中文</option>
              <option value="ja">日本語</option>
              <option value="en">English</option>
            </select>
          </label>
          <span class="creator-credit" id="creatorCredit">Dan 制作</span>
          <button id="resetBtn" class="btn secondary">恢复默认</button>
          <button id="exportBtn" class="btn primary">导出素材</button>
        </div>
      </header>

      <section class="workspace">
        <aside class="panel controls-panel">
          <div class="panel-title">
            <span class="step">01</span>
            <div>
              <h2>导入素材</h2>
              <p>支持 MP3、WAV、M4A、MP4、WebM</p>
            </div>
          </div>
          <label id="dropZone" class="drop-zone" for="fileInput">
            <input id="fileInput" type="file" accept="audio/*,video/*" hidden />
            <span class="upload-icon">+</span>
            <strong>拖入音频 / 视频</strong>
            <small>或点击选择本地文件</small>
          </label>
          <div id="fileCard" class="file-card hidden">
            <div class="file-dot"></div>
            <div class="file-copy">
              <strong id="fileName">未选择文件</strong>
              <span id="fileMeta">等待导入</span>
            </div>
            <button id="removeFileBtn" class="icon-btn" title="移除素材">×</button>
          </div>

          <div class="section-divider"></div>
          <div class="panel-title compact">
            <span class="step">02</span>
            <div><h2>样式</h2></div>
          </div>
          <div class="style-grid">
            <button class="style-card active" data-style="circle"><span class="style-preview circle"></span><b>环形频谱</b></button>
            <button class="style-card" data-style="bars"><span class="style-preview bars"></span><b>长条频谱</b></button>
            <button class="style-card" data-style="wave"><span class="style-preview wave"></span><b>流动波形</b></button>
            <button class="style-card" data-style="orbit"><span class="style-preview orbit"></span><b>粒子轨道</b></button>
            <button class="style-card" data-style="line"><span class="style-preview line"></span><b>线性脉冲</b></button>
          </div>

          <div class="section-divider"></div>
          <div class="panel-title compact">
            <span class="step">03</span>
            <div><h2>自定义</h2></div>
          </div>
          <div class="form-grid">
            <label>主色 <input id="colorA" type="color" value="#7c5cff" /></label>
            <label>辅色 <input id="colorB" type="color" value="#39e7d6" /></label>
          </div>
          <label class="control-row">元素数量 <output id="countOut">96</output><input id="count" type="range" min="24" max="180" value="96" /></label>
          <label class="control-row">律动强度 <output id="powerOut">1.35</output><input id="power" type="range" min="50" max="240" value="135" /></label>
          <label class="control-row">线条粗细 <output id="thicknessOut">4</output><input id="thickness" type="range" min="1" max="18" value="4" /></label>
          <label class="control-row">平滑程度 <output id="smoothOut">78%</output><input id="smooth" type="range" min="0" max="95" value="78" /></label>
          <label class="control-row">基础半径 <output id="radiusOut">150</output><input id="radius" type="range" min="60" max="260" value="150" /></label>
          <label class="select-row"><span>频谱布局</span>
            <select id="spectrumLayout">
              <option value="original">原始频段：低 → 高</option>
              <option value="center" selected>中心对称：高 ← 低 → 高</option>
              <option value="edges">双向镜像：低 → 高 ← 低</option>
            </select>
          </label>
          <div class="toggle-row"><span>弱频活跃补偿</span><input id="dynamicGain" type="checkbox" checked /></div>
          <div class="toggle-row"><span>镜像效果</span><input id="mirror" type="checkbox" checked /></div>
          <div class="toggle-row"><span>辉光效果</span><input id="glow" type="checkbox" checked /></div>
          <label class="select-row"><span>导出方式</span>
            <select id="exportMode">
              <option value="folder" selected>长素材：透明 PNG 序列写入文件夹</option>
              <option value="pngzip">短素材：透明 PNG 序列 ZIP</option>
              <option value="webm">兼容导出：透明 WebM（实时录制）</option>
            </select>
          </label>
          <small id="exportHint" class="export-hint">逐帧直接写入你选择的文件夹，不占用大量内存。请选择 D:、E: 或其他非 C: 盘目录。</small>
          <div class="toggle-row"><span>导出包含原音频</span><input id="includeAudio" type="checkbox" /></div>
        </aside>

        <section class="stage-column">
          <div class="stage-toolbar">
            <div class="status-wrap"><span class="status-dot"></span><span id="statusText">演示模式</span></div>
            <div class="canvas-size">
              <label>画布
                <select id="resolution">
                  <option value="1080">1080 × 1080</option>
                  <option value="1920x1080">1920 × 1080</option>
                  <option value="1080x1920">1080 × 1920</option>
                  <option value="720">720 × 720</option>
                </select>
              </label>
              <label>帧率
                <select id="fps"><option>30</option><option selected>60</option></select>
              </label>
            </div>
          </div>
          <div class="preview-shell">
            <div id="checker" class="checker">
              <canvas id="visualizer" width="1080" height="1080"></canvas>
            </div>
            <span class="transparent-badge">透明背景预览</span>
          </div>
          <div class="transport">
            <button id="playBtn" class="play-btn">▶</button>
            <span id="currentTime">00:00</span>
            <input id="seek" type="range" min="0" max="1000" value="0" />
            <span id="duration">00:00</span>
          </div>
          <div class="tips">
            <div><b>透明背景</b><span>导出的 WebM 可作为叠加素材使用</span></div>
            <div><b>实时响应</b><span>频谱会跟随素材音量变化</span></div>
            <div><b>本地处理</b><span>素材不会上传到网络</span></div>
          </div>
        </section>
      </section>
    </main>
    <div id="toast" class="toast"></div>
    <audio id="audioEl" crossorigin="anonymous"></audio>
    <video id="videoEl" crossorigin="anonymous" playsinline></video>
    <script src="./i18n.js"></script>
    <script src="./app.js?v=5"></script>
  </body>
</html>
